# .goreleaser.yaml
project_name: service-user

builds:
  # ═══════════════════════════════════════════════════════════
  # STATIC BUILDS (Portability focus)
  # ═══════════════════════════════════════════════════════════

  - id: static-linux
    main: ./cmd/main.go
    binary: service-user
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -extldflags '-static'
    tags:
      - netgo
      - osusergo
    flags:
      - -trimpath

  - id: static-darwin
    main: ./cmd/main.go
    binary: service-user
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    flags:
      - -trimpath

  - id: static-windows
    main: ./cmd/main.go
    binary: service-user
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w
    flags:
      - -trimpath

  # ═══════════════════════════════════════════════════════════
  # DYNAMIC BUILDS (glibc-specific)
  # ═══════════════════════════════════════════════════════════
  # Note: Dynamic builds require CGO_ENABLED=1 and appropriate build environment
  # These builds should be run in CI/CD with the target distribution containers
  # The configurations below assume the build host has the required toolchains

  # glibc 2.28 (Debian 10 Buster) - Build on Debian 10 or equivalent
  - id: dynamic-glibc228
    main: ./cmd/main.go
    binary: service-user
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    flags:
      - -trimpath

  # glibc 2.31 (Debian 11 Bullseye) - Build on Debian 11 or equivalent
  - id: dynamic-glibc231
    main: ./cmd/main.go
    binary: service-user
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    flags:
      - -trimpath

  # glibc 2.36 (Debian 12 Bookworm) - Build on Debian 12 or equivalent
  - id: dynamic-glibc236
    main: ./cmd/main.go
    binary: service-user
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    flags:
      - -trimpath

  # glibc 2.39 (Ubuntu 24.04) - Build on Ubuntu 24.04 or equivalent
  - id: dynamic-glibc239
    main: ./cmd/main.go
    binary: service-user
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    flags:
      - -trimpath

archives:
  # Static archives - simple naming
  - id: static
    ids:
      - static-linux
      - static-darwin
      - static-windows
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - "zip"
    files:
      - src: config.yaml.example
      - src: README.md

  # Dynamic archives - glibc version in filename
  - id: dynamic-glibc228
    builds:
      - dynamic-glibc228
    name_template: "{{ .ProjectName }}_{{ .Version }}_linux_glibc228_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    format: tar.gz
    files:
      - src: config.yaml.example
      - src: README.md
      - src: DYNAMIC_NOTES.md

  - id: dynamic-glibc231
    builds:
      - dynamic-glibc231
    name_template: "{{ .ProjectName }}_{{ .Version }}_linux_glibc231_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    format: tar.gz
    files:
      - src: config.yaml.example
      - src: README.md
      - src: DYNAMIC_NOTES.md

  - id: dynamic-glibc236
    builds:
      - dynamic-glibc236
    name_template: "{{ .ProjectName }}_{{ .Version }}_linux_glibc236_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    format: tar.gz
    files:
      - src: config.yaml.example
      - src: README.md
      - src: DYNAMIC_NOTES.md

  - id: dynamic-glibc239
    builds:
      - dynamic-glibc239
    name_template: "{{ .ProjectName }}_{{ .Version }}_linux_glibc239_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    format: tar.gz
    files:
      - src: config.yaml.example
      - src: README.md
      - src: DYNAMIC_NOTES.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

signs:
  # Note: GPG signing is optional. If GPG is not configured, goreleaser will skip signing.
  # To enable GPG signing, configure a GPG key and ensure GITHUB_TOKEN has access.
  - artifacts: all
    signature: "${artifact}.sig"
    cmd: gpg
    args:
      - "--output"
      - "${signature}"
      - "--detach-sig"
      - "${artifact}"
  # Environment variables (optional, for CI/CD):
  # GPG_FINGERPRINT: The fingerprint of the signing key
  # GPG_PASSWORD: The password for the signing key (use GitHub Secrets)

release:
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## Release {{ .Tag }} ({{ .Date }})
  footer: |
    ## What's Changed
    Full Changelog: https://github.com/{{ .Env.GITHUB_REPOSITORY }}/compare/{{ .PreviousTag }}...{{ .Tag }}
  extra_files:
    - glob: ./config.yaml.example

changelog:
  disable: false
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^build:"
      - "^chore:"
      - "^refactor:"

dist: dist
