name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: service_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:4.2.3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: rabbit
          RABBITMQ_DEFAULT_PASS: password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_port_connectivity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Checkout service-user-db
        uses: actions/checkout@v6
        with:
          repository: adityakw90/service-user-db
          path: service-user-db

      - name: Run Migrations
        working-directory: service-user-db
        run: |
          # LPM can report HTTP error responses as checksum failures. Fetch the
          # pinned driver from Maven Central with retries and fail-closed SHA-256
          # verification instead. Update the version and checksum together.
          driver="${RUNNER_TEMP}/postgresql-42.7.14.jar"
          curl --fail --show-error --silent --location --retry 5 \
            --connect-timeout 15 --max-time 120 \
            https://repo.maven.apache.org/maven2/org/postgresql/postgresql/42.7.14/postgresql-42.7.14.jar \
            --output "$driver"
          echo "73914527305a40cce504b0d3d90b23caf565136912d607ae8ae7c5895512332c  $driver" | sha256sum --check --strict

          # Pin the same official Liquibase 5.0-alpine image used by the DB repo.
          # Mount the verified JDBC driver without rebuilding its LPM-based image.
          docker run --rm --network host \
            --volume "$PWD:/liquibase/changes:ro" \
            --volume "$driver:/liquibase/lib/postgresql.jar:ro" \
            --workdir /liquibase/changes \
            liquibase/liquibase:5.0-alpine@sha256:9ebeda802be73ea8c04b203701307ed6e976952ca798b6126e1b0e651eed7a17 \
            --changelog-file=master.yml \
            --url=jdbc:postgresql://localhost:5432/service_db \
            --username=postgres \
            --password=postgres \
            update

      - name: Run tests
        env:
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: service_db
        run: make test-cover

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.txt
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
