name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: service_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:4.2.3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: rabbit
          RABBITMQ_DEFAULT_PASS: password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_port_connectivity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      kafka:
        image: confluentinc/cp-kafka:8.0.3
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: "controller,broker"
          KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
          KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
          KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
          KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
          KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          KAFKA_LOG_RETENTION_HOURS: "1"
          KAFKA_LOG_SEGMENT_BYTES: "1073741824"
          KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "300000"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
        ports:
          - 9092:9092
          - 9094:9094
        options: >-
          --health-cmd "kafka-topics --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.5"
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Checkout service-user-db
        uses: actions/checkout@v6
        with:
          repository: adityakw90/service-user-db
          path: service-user-db

      - name: Run Migrations
        working-directory: service-user-db
        run: |
          echo "DATABASE_URL=jdbc:postgresql://localhost:5432/service_db" > .env
          echo "DATABASE_USER=postgres" >> .env
          echo "DATABASE_PASSWORD=postgres" >> .env
          sed -i 's/docker run --rm/docker run --rm --network host/g' Makefile
          make build
          make update

      - name: Run tests
        env:
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: service_db
        run: make test-cover

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=${{ contains(VERSION, '-') }}" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.libc }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: release

    strategy:
      matrix:
        include:
          # glibc builds (Debian/Ubuntu/Fedora/RHEL)
          - libc: glibc
            arch: amd64
            base_image: debian:bookworm-slim
            go_cc: gcc
            go_env_ldflags: ""
          - libc: glibc
            arch: arm64
            base_image: debian:bookworm-slim
            go_cc: aarch64-linux-gnu-gcc
            go_env_cc: "CC=aarch64-linux-gnu-gcc"
            go_env_ldflags: ""
            qemu_platform: linux/arm64
            qemu_bin: qemu-aarch64

          # musl builds (Alpine)
          - libc: musl
            arch: amd64
            base_image: alpine:latest
            go_cc: gcc
            go_env_ldflags: '-linkmode external -extldflags "-static"'
          - libc: musl
            arch: arm64
            base_image: alpine:latest
            go_cc: gcc
            go_env_ldflags: '-linkmode external -extldflags "-static"'
            qemu_platform: linux/arm64
            qemu_bin: qemu-aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.5"
          cache-dependency-path: go.sum

      - name: Install QEMU and cross-compiler for ARM64
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: Set up QEMU binfmt registration
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.qemu_platform }}

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch == 'amd64' && 'amd64' || 'arm64' }}
          CGO_ENABLED: "0"
          CC: ${{ matrix.go_cc }}
          VERSION: ${{ github.ref_name }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
          BUILD_LIBC: ${{ matrix.libc }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          BINARY_NAME="service-user-${VERSION#v}-linux-${BUILD_LIBC}-${BUILD_ARCH}"
          BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          if [ "${BUILD_LIBC}" == "musl" ]; then
            # Static build for musl
            go build -ldflags "-X 'main.Version=${VERSION#v}' -X 'main.BuildTime=$BUILD_TIME' ${{ matrix.go_env_ldflags }}" -o "$BINARY_NAME" cmd/main.go
          else
            # Standard build for glibc
            go build -ldflags "-X 'main.Version=${VERSION#v}' -X 'main.BuildTime=$BUILD_TIME'" -o "$BINARY_NAME" cmd/main.go
          fi

          chmod +x "$BINARY_NAME"
          ./"$BINARY_NAME" --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: service-user-${{ github.ref_name }}-linux-${{ matrix.libc }}-${{ matrix.arch }}
          path: service-user-${{ github.ref_name }}-linux-${{ matrix.libc }}-${{ matrix.arch }}

  package:
    name: Package Release Assets
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create checksums
        run: |
          cd artifacts
          for dir in */; do
            cd "$dir"
            for file in *; do
              if [ -f "$file" ]; then
                sha256sum "$file" >> ../checksums.txt
              fi
            done
            cd ..
          done
          mv checksums.txt ../checksums.txt

      - name: Create config.yaml.example
        run: |
          # Create a minimal default config.yaml if it doesn't exist
          if [ ! -f config.yaml ]; then
            cat > config.yaml << 'EOF'
          app:
            code: SUS
            name: Service User
            env: production
            debug: false
            ip: 0.0.0.0
            port: 50051

          instance:
            host: localhost
            name: service-user

          database:
            host: localhost
            port: 5432
            user: your_db_user
            password: your_db_password
            name: service_user
            sslmode: disable
            timezone: UTC
            min_conns: 1
            min_idle_conns: 0
            max_conns: 10
            max_conn_idle_time: 5m
            max_conn_lifetime: 1h
            max_conn_lifetime_jitter: 1m
            health_check_period: 1m
            query_exec_mode: cache_describe

          redis:
            host: localhost
            port: 6379
            user: ""
            password: your_redis_password
            db: 0
            pool_size: 10
            pool_timeout: 5s
            connection_idle_min: 10

          kafka:
            brokers:
              - localhost:9092
            compression: snappy
            max_message_bytes: 1048576
            timeout_seconds: 5
            reconnect_interval_seconds: 1
            reconnect_max_attempts: 0

          rabbitmq:
            host: localhost
            port: 5672
            user: your_rabbitmq_user
            password: your_rabbitmq_password
            vhost: /
            reconnect_interval: 1s
            reconnect_max_attempts: 0

          event_publisher:
            enabled: true
            batch_size: 50
            batch_timeout: 5s
            queue_size: 1000
            worker_count: 2
            max_retries: 3
            retry_interval: 2s
            http:
              enabled: false
              url: ""
              timeout: 5s
            redis:
              enabled: false
              name: "user-service.events"
            kafka:
              enabled: false
              topic: user-service-events
            rabbitmq:
              enabled: true
              durable: true
              exchange: user-service
              exchange_type: topic
              routing_key_prefix: user.service.
              confirm_timeout: 30s
              max_retries: 5
              retry_interval: 1s
              queue_enabled: true
              queue_name: "user-service.queue"
              queue_durable: true
              queue_auto_delete: false
              queue_exclusive: false

          monitoring:
            service_name: service-user
            environment: production
            logger:
              level: info
            tracer:
              provider: otlp
              provider_host: localhost
              provider_port: 4317
              sample_ratio: 1
              insecure: true
            metric:
              provider: otlp
              provider_host: localhost
              provider_port: 4317
              insecure: true

          observer:
            auth: true
            device: true
            pin: true
            user: true
            userfile: true

          security:
            login_tracker:
              backend: redis
              lockout_counter_ttl: 30m
              lockout_duration: 15m
              lockout_threshold: 5
            pin_tracker:
              backend: redis
              lockout_counter_ttl: 30m
              lockout_duration: 15m
              lockout_threshold: 3
            rate_limiter:
              backend: redis
              limit: 100
              window_size: 1h

          jwt:
            secret_key: your-256-bit-secret-key-for-jwt-signing
            access_expiry: 5m
            refresh_expiry: 168h

          password_hasher:
            type: argon2
            cost: 10
            salt: ""
            memory: 65536
            iterations: 2
            parallelism: 1
            salt_length: 16
            key_length: 32

          pin_hasher:
            type: argon2
            cost: 14
            salt: ""
            memory: 65536
            iterations: 4
            parallelism: 1
            salt_length: 16
            key_length: 32

          oauth:
            enabled: false
            google:
              enabled: false
              client_id: your_google_client_id
              client_secret: your_google_client_secret
          EOF
          fi
          chmod +x release/scripts/create-config-example.sh
          ./release/scripts/create-config-example.sh config.yaml config.yaml.example

      - name: Prepare README.md from template
        run: |
          VERSION="${{ github.ref_name }}"
          sed "s/{VERSION}/${VERSION#v}/g" release/templates/README.md.tpl > README.md

      - name: Copy systemd service template
        run: |
          cp release/templates/systemd.service service-user.service

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*/service-user-*
            checksums.txt
            config.yaml.example
            README.md
            service-user.service
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
