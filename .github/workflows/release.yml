name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: service_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:4.2.3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: rabbit
          RABBITMQ_DEFAULT_PASS: password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_port_connectivity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      kafka:
        image: confluentinc/cp-kafka:8.0.3
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: "controller,broker"
          KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
          KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
          KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
          KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
          KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          KAFKA_LOG_RETENTION_HOURS: "1"
          KAFKA_LOG_SEGMENT_BYTES: "1073741824"
          KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "300000"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
        ports:
          - 9092:9092
          - 9094:9094
        options: >-
          --health-cmd "kafka-topics --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.5"
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Checkout service-user-db
        uses: actions/checkout@v6
        with:
          repository: adityakw90/service-user-db
          path: service-user-db

      - name: Run Migrations
        working-directory: service-user-db
        run: |
          echo "DATABASE_URL=jdbc:postgresql://localhost:5432/service_db" > .env
          echo "DATABASE_USER=postgres" >> .env
          echo "DATABASE_PASSWORD=postgres" >> .env
          sed -i 's/docker run --rm/docker run --rm --network host/g' Makefile
          make build
          make update

      - name: Run tests
        env:
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: service_db
        run: make test-cover

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Check if version contains '-' for prerelease detection
          if [[ "$VERSION" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi
          echo "Version: $VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.libc }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: release

    strategy:
      matrix:
        include:
          # glibc builds (Debian/Ubuntu/Fedora/RHEL)
          - libc: glibc
            arch: amd64
            base_image: debian:bookworm-slim
          - libc: glibc
            arch: arm64
            base_image: debian:bookworm-slim
            qemu_platform: linux/arm64
            qemu_bin: qemu-aarch64

          # musl builds (Alpine)
          - libc: musl
            arch: amd64
            base_image: alpine:latest
          - libc: musl
            arch: arm64
            base_image: alpine:latest
            qemu_platform: linux/arm64
            qemu_bin: qemu-aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.5"
          cache-dependency-path: go.sum

      - name: Install QEMU and cross-compiler for ARM64
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: Set up QEMU binfmt registration
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.qemu_platform }}

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch == 'amd64' && 'amd64' || 'arm64' }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
          BUILD_LIBC: ${{ matrix.libc }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          BINARY_NAME="service-user-${VERSION#v}-linux-${BUILD_LIBC}-${BUILD_ARCH}"
          BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          # Build with CGO_ENABLED=0 for static binary
          # Go automatically creates static binaries when CGO is disabled
          go build -ldflags "-s -w -X 'main.Version=${VERSION#v}' -X 'main.BuildTime=$BUILD_TIME'" -o "$BINARY_NAME" cmd/main.go

          chmod +x "$BINARY_NAME"
          ./"$BINARY_NAME" --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: service-user-${{ matrix.libc }}-${{ matrix.arch }}
          path: service-user-*

  package:
    name: Package Release Assets
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: service-user-*
          merge-multiple: true

      - name: Create checksums
        run: |
          # With merge-multiple: true, artifacts are flattened into artifacts/
          cd artifacts
          sha256sum service-user-* > checksums.txt
          cat checksums.txt
          mv checksums.txt ../checksums.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/service-user-*
            checksums.txt
            config.yaml.example
            service-user.service
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
